# Install source belonging to the called workflow, never the caller's SHA.
# Consumers must pin uses: to a reviewed full commit SHA.
name: Reusable Quality Gate
on:
  workflow_call:
    inputs:
      language:
        description: "Toolchain analyser family: rust, node, or go"
        required: true
        type: string
      scan-path:
        description: "Single project directory relative to the caller repository"
        type: string
        default: "."
      checks:
        description: "Comma-separated checks; empty selects all checks for the language"
        type: string
        default: ""
      asguardian-ref:
        description: "Full analyzer SHA fallback without job.workflow_sha (GHES); must match it when available"
        type: string
        default: ""
      timeout-seconds:
        description: "Positive per-check subprocess timeout; empty uses analyser defaults"
        type: string
        default: ""
      node-version:
        description: "Node version supported by the caller's committed npm lockfile"
        type: string
        default: "20"
      node-install-path:
        description: "npm lockfile directory relative to caller; empty uses scan-path (workspace roots supported)"
        type: string
        default: ""
      rust-toolchain:
        description: "Exact Rust release (X.Y.Z); required for Rust checks"
        type: string
        default: ""
      cargo-audit-version:
        description: "Exact cargo-audit release (X.Y.Z); required when rust-audit is selected"
        type: string
        default: ""
      govulncheck-version:
        description: "Exact govulncheck module version (vX.Y.Z); required when go-vuln is selected"
        type: string
        default: ""
    secrets:
      asguardian-token:
        description: "Optional read-only token for private analyzer source checkout"
        required: false
permissions:
  contents: read
jobs:
  quality-gate:
    name: Quality Gate (${{ inputs.language }})
    runs-on: arc-x86
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve immutable analyzer source
        id: source
        env:
          CALLED_SHA: ${{ job.workflow_sha }}
          CALLED_REPOSITORY: ${{ job.workflow_repository }}
          REQUESTED_SHA: ${{ inputs.asguardian-ref }}
        run: |
          set -euo pipefail
          if [[ -n "$CALLED_SHA" && -n "$REQUESTED_SHA" && "$CALLED_SHA" != "$REQUESTED_SHA" ]]; then
            echo '::error::asguardian-ref must match the called workflow commit' >&2
            exit 1
          fi
          analyzer_sha="${CALLED_SHA:-$REQUESTED_SHA}"
          if [[ ! "$analyzer_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::No immutable analyzer SHA: supply a full asguardian-ref when job.workflow_sha is unavailable' >&2
            exit 1
          fi
          analyzer_repository="${CALLED_REPOSITORY:-primordial-creations/asguardian}"
          if [[ ! "$analyzer_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo '::error::Invalid analyzer repository' >&2
            exit 1
          fi
          echo "sha=$analyzer_sha" >> "$GITHUB_OUTPUT"
          echo "repository=$analyzer_repository" >> "$GITHUB_OUTPUT"
      - name: Checkout caller repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: caller
          persist-credentials: false
      - name: Checkout asguardian
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha }}
          path: .asguardian-src
          fetch-depth: 0  # setuptools-scm needs release tag history
          token: ${{ secrets.asguardian-token || github.token }}
          persist-credentials: false
      - name: Verify analyzer checkout
        env:
          ANALYZER_SHA: ${{ steps.source.outputs.sha }}
        run: test "$(git -C .asguardian-src rev-parse HEAD)" = "$ANALYZER_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate project and checks
        id: plan
        env:
          GATE_LANGUAGE: ${{ inputs.language }}
          GATE_SCAN_PATH: ${{ inputs.scan-path }}
          GATE_CHECKS: ${{ inputs.checks }}
          GATE_TIMEOUT: ${{ inputs.timeout-seconds }}
          GATE_NODE_INSTALL_PATH: ${{ inputs.node-install-path }}
          GATE_RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
          GATE_CARGO_AUDIT_VERSION: ${{ inputs.cargo-audit-version }}
          GATE_GOVULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
        run: python .asguardian-src/scripts/reusable_quality_gate.py plan caller
      - name: Install asguardian with declared runtime dependencies
        run: python -m pip install ./.asguardian-src
      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: ${{ steps.plan.outputs.scan-path }}/go.mod
          cache-dependency-path: ${{ steps.plan.outputs.scan-path }}/go.sum
      - name: Set up Node
        if: inputs.language == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install locked Node project dependencies
        if: inputs.language == 'node'
        working-directory: ${{ steps.plan.outputs.node-install-path }}
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Set up Rust
        if: inputs.language == 'rust'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          components: clippy
      - name: Install selected cargo-audit version
        if: steps.plan.outputs.rust-audit == 'true'
        env:
          AUDIT_VERSION: ${{ inputs.cargo-audit-version }}
          RUSTUP_TOOLCHAIN: ${{ steps.plan.outputs.rust-toolchain }}
        run: cargo install cargo-audit --version "=$AUDIT_VERSION" --locked
      - name: Install selected govulncheck version
        if: steps.plan.outputs.go-vuln == 'true'
        env:
          VULNCHECK_VERSION: ${{ inputs.govulncheck-version }}
        run: go install "golang.org/x/vuln/cmd/govulncheck@$VULNCHECK_VERSION"
      - name: Run required quality checks
        env:
          GATE_SCAN_PATH: ${{ steps.plan.outputs.scan-path }}
          GATE_CHECKS: ${{ steps.plan.outputs.checks }}
          GATE_TIMEOUT: ${{ inputs.timeout-seconds }}
          GATE_NODE_INSTALL_PATH: ${{ steps.plan.outputs.node-install-path }}
          GATE_RUST_TOOLCHAIN: ${{ steps.plan.outputs.rust-toolchain }}
        run: python .asguardian-src/scripts/reusable_quality_gate.py run caller
