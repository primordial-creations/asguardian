name: Qualify Asgard Python SDK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: arc-x86
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - name: Qualify wheel and sdist outside checkout
        run: python scripts/qualify_python_sdk.py --scratch-root "$RUNNER_TEMP/asgard-consumers" --output "$RUNNER_TEMP/asgard-sdk-artifacts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asgard-python-sdk-candidate
          path: ${{ runner.temp }}/asgard-sdk-artifacts
          if-no-files-found: error
