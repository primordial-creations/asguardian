name: Qualify Asgard process SDKs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: arc-x86
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96.0'
          components: clippy
      - run: python -m pip install build
      - name: Qualify wheel and sdist outside checkout
        run: python scripts/qualify_python_sdk.py --scratch-root "$RUNNER_TEMP/asgard-consumers" --output "$RUNNER_TEMP/asgard-sdk-artifacts"
      - name: Qualify separately installed engine
        run: python scripts/qualify_python_engine.py --sdk-evidence "$RUNNER_TEMP/asgard-sdk-artifacts/verification.json" --scratch-root "$RUNNER_TEMP/asgard-consumers" --output "$RUNNER_TEMP/asgard-engine-artifacts"
      - name: Qualify Node artifact against installed engines
        run: python scripts/qualify_node_sdk.py --engine-evidence "$RUNNER_TEMP/asgard-engine-artifacts/verification.json" --scratch-root "$RUNNER_TEMP/asgard-consumers" --output "$RUNNER_TEMP/asgard-node-artifacts"
      - name: Qualify immutable Go module against installed engines
        run: python scripts/qualify_go_sdk.py --engine-evidence "$RUNNER_TEMP/asgard-engine-artifacts/verification.json" --consumer "$RUNNER_TEMP/asgard-go-consumer" --output "$RUNNER_TEMP/asgard-go-artifacts"
      - name: Fetch pinned Rust dependencies
        run: cargo fetch --locked --manifest-path sdks/rust/Cargo.toml
      - name: Qualify Rust crate against installed engines
        run: python scripts/qualify_rust_sdk.py --engine-evidence "$RUNNER_TEMP/asgard-engine-artifacts/verification.json" --consumer "$RUNNER_TEMP/asgard-rust-consumer" --output "$RUNNER_TEMP/asgard-rust-artifacts" --target "$RUNNER_TEMP/asgard-rust-target"
      - name: Compare common four-language conformance
        run: python scripts/compare_process_sdk_conformance.py --python "$RUNNER_TEMP/asgard-engine-artifacts/verification.json" --node "$RUNNER_TEMP/asgard-node-artifacts/verification.json" --go "$RUNNER_TEMP/asgard-go-artifacts/verification.json" --rust "$RUNNER_TEMP/asgard-rust-artifacts/verification.json" --output "$RUNNER_TEMP/asgard-process-conformance.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asgard-process-sdk-candidates
          path: |
            ${{ runner.temp }}/asgard-sdk-artifacts
            ${{ runner.temp }}/asgard-engine-artifacts
            ${{ runner.temp }}/asgard-node-artifacts
            ${{ runner.temp }}/asgard-go-artifacts
            ${{ runner.temp }}/asgard-rust-artifacts
            ${{ runner.temp }}/asgard-process-conformance.json
          if-no-files-found: error
