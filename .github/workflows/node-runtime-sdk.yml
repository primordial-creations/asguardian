name: Qualify Asgard Node runtime compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: arc-x86
    strategy:
      fail-fast: false
      matrix:
        node: ['18.0.0', '18.20.8', '20.19.0', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install build
      - name: Install isolated runtime without changing build tooling
        env:
          TEST_NODE: ${{ matrix.node }}
        run: npm install --prefix "$RUNNER_TEMP/runtime" --no-audit --no-fund "node@$TEST_NODE"
      - name: Qualify SDK and both installed engines
        run: |
          python scripts/qualify_python_sdk.py --scratch-root "$RUNNER_TEMP/consumers" --output "$RUNNER_TEMP/artifacts/python"
          python scripts/qualify_python_engine.py --sdk-evidence "$RUNNER_TEMP/artifacts/python/verification.json" --scratch-root "$RUNNER_TEMP/consumers" --output "$RUNNER_TEMP/artifacts/engine"
          python scripts/qualify_node_sdk.py --node "$RUNNER_TEMP/runtime/node_modules/node/bin/node" --engine-evidence "$RUNNER_TEMP/artifacts/engine/verification.json" --scratch-root "$RUNNER_TEMP/consumers" --output "$RUNNER_TEMP/artifacts/node"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asgard-node-${{ matrix.node }}-${{ github.sha }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: error
