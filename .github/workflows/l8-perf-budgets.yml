# =========================================================================
# DRAFT — NOT YET ENABLED.
#
# L8 performance-budget regression gate. Every job carries `if: false` so
# this workflow never runs; enabling it (removing the guards and deciding
# whether it is required for merge) is Jake's call. Policy and rationale:
# _Docs/Testing/L8_Perf_Budget_Policy.md.
# =========================================================================
name: L8 Perf Budgets (draft, disabled)

on:
  pull_request:
    paths:
      - "Asgard/**"
      - "Asgard_Test/L8_budgets.yaml"
      - "Asgard_Test/L8_PerfBudgets/**"
      - "Asgard_Test/**/L8_Performance/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  l8-budgets:
    # DISABLED: flip to a real condition (or remove) to enable.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package (push / workflow_dispatch only — trusted)
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-benchmark pyyaml
      - name: Install test deps without editable package (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-benchmark pyyaml
      - name: Budgeted smoke + corpus + self-scan + CIR 50k
        run: python -m pytest Asgard_Test/L8_PerfBudgets -q
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}
      - name: Gated pytest-benchmark suites
        run: |
          python -m pytest \
            Asgard_Test/tests_Heimdall/L8_Performance \
            Asgard_Test/tests_Forseti/L8_Performance \
            Asgard_Test/tests_Freya/L8_Performance \
            Asgard_Test/tests_Verdandi/L8_Performance \
            Asgard_Test/tests_Volundr/L8_Performance \
            -q --benchmark-min-rounds=1 --benchmark-max-time=0.5
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}
