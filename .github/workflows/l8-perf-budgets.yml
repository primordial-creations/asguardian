# =========================================================================
# DRAFT — NOT YET ENABLED.
#
# L8 performance-budget regression gate. Every job carries `if: false` so
# this workflow never runs; enabling it (removing the guards and deciding
# whether it is required for merge) is Jake's call. Policy and rationale:
# _Docs/Testing/L8_Perf_Budget_Policy.md.
# =========================================================================
name: L8 Perf Budgets (draft, disabled)

on:
  pull_request:
    paths:
      - "Asgard/**"
      - "Asgard_Test/L8_budgets.yaml"
      - "Asgard_Test/L8_PerfBudgets/**"
      - "Asgard_Test/**/L8_Performance/**"
      - "pyproject.toml"
      - ".github/workflows/l8-perf-budgets.yml"
      - "_Docs/Testing/L8_Perf_Budget_Policy.md"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  l8-budgets:
    # DISABLED: flip to a real condition (or remove) to enable.
    if: false
    runs-on: arc-x86
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install package (workflow_dispatch only — trusted)
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[l8]"
      - name: Install test deps without editable package (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip
          # Mirrors the effective base + [l8] dependency set above without
          # executing setup/build hooks from an untrusted pull request.
          pip install "pytest>=7.0.0" "pytest-benchmark>=4.0.0" \
            "pydantic>=2.0.0" "pyyaml>=6.0" "playwright==1.56.0" \
            "httpx>=0.24.0" "networkx>=3.0" \
            "tree-sitter==0.25.2" tree-sitter-python tree-sitter-javascript \
            tree-sitter-typescript tree-sitter-java tree-sitter-go \
            tree-sitter-ruby tree-sitter-php tree-sitter-c-sharp \
            tree-sitter-cpp tree-sitter-rust tree-sitter-c
      - name: Budgeted smoke + corpus + self-scan + CIR 50k
        run: python -m pytest Asgard_Test/L8_PerfBudgets -q
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}
      - name: Gated pytest-benchmark suites
        run: |
          python -m pytest \
            Asgard_Test/tests_Heimdall/L8_Performance \
            Asgard_Test/tests_Forseti/L8_Performance \
            Asgard_Test/tests_Freya/L8_Performance \
            Asgard_Test/tests_Verdandi/L8_Performance \
            Asgard_Test/tests_Volundr/L8_Performance \
            -q --benchmark-min-rounds=1 --benchmark-max-time=0.5
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}
