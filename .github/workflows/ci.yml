name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Fork PRs: enable "Require approval for all outside collaborators" in
# repo Settings → Actions → General. Workflow YAML cannot set that gate.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'arc-x86' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  type-check:
    name: Type Check
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'arc-x86' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test extras (push/main only)
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -e ".[test]"

      - name: Install mypy without editable package (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install mypy pydantic pyyaml playwright httpx

      - name: Run mypy
        run: mypy Asgard/
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'arc-x86' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (push/main only — trusted)
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Install test deps without editable package (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.0.0" "pytest-asyncio>=0.21.0" "pytest-mock>=3.10.0" "pytest-cov>=4.0.0" pydantic pyyaml playwright httpx

      - name: Run tests
        run: pytest Asgard_Test/ -v --tb=short --ignore=Asgard_Test/fixtures
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: pytest Asgard_Test/ --cov=Asgard --cov-report=term-missing --cov-report=xml --ignore=Asgard_Test/fixtures
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml
