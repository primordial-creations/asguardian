name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Fork PRs: enable "Require approval for all outside collaborators" in
# repo Settings → Actions → General. Workflow YAML cannot set that gate.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: arc-x86
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  type-check:
    name: Type Check
    runs-on: arc-x86
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test extras (push/main only)
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -e ".[test]"

      - name: Install mypy without editable package (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install mypy pydantic pyyaml playwright httpx "networkx>=3.0"

      - name: Run mypy
        run: mypy Asgard/
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: arc-x86
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (push/main only — trusted)
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Check installed console entrypoints (push/main only — trusted)
        if: github.event_name != 'pull_request'
        run: |
          cd "$RUNNER_TEMP"
          for command in asguardian asgard asguardian-dashboard asgard-dashboard asguardian-mcp asgard-mcp; do
            "$command" --help > /dev/null
          done

      # Deliberately does not install the package itself: a pull request's code
      # must not be executed through setup hooks on a trusted runner. That means
      # this list stands in for pyproject.toml's [test] extra by hand, and it had
      # drifted from it -- so on pull requests, which is the gate that actually
      # reviews changes, the tree-sitter grammars and pylint were absent and
      # playwright was unpinned. The [test] extra's own comments say those
      # dependencies exist because "CI silently ran those tests against the
      # degraded path" and a security test "had never run"; both were still true
      # here. Keep this list in step with [test] and [treesitter] in
      # pyproject.toml.
      - name: Install test deps without editable package (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7.0.0" "pytest-asyncio>=0.21.0" "pytest-mock>=3.10.0" "pytest-cov>=4.0.0" pydantic pyyaml httpx "networkx>=3.0" \
            "playwright==1.56.0" "pylint>=3.0" \
            "tree-sitter==0.25.2" tree-sitter-python tree-sitter-javascript tree-sitter-typescript \
            tree-sitter-java tree-sitter-go tree-sitter-ruby tree-sitter-php \
            tree-sitter-c-sharp tree-sitter-cpp tree-sitter-rust tree-sitter-c

      # The 79 Freya L1 tests skip themselves unless a real Chromium matching
      # the pinned playwright is launchable. Without this they were skipping in
      # CI, silently, whatever the pin said.
      - name: Install the Chromium playwright is pinned against
        run: python -m playwright install --with-deps chromium

      # Thirteen L3_Contract tests across Volundr (external_tools.py,
      # render_pipeline.py) skip themselves unless kubeconform, actionlint,
      # kustomize, kubectl, and hadolint are on PATH. None of these are
      # compiled or installed through pip/npm setup hooks -- each is a single
      # pinned prebuilt release binary fetched over plain curl and checksum-
      # verified, so this runs identically on both the trusted push/main path
      # and the package-free pull_request path without reopening the "PR code
      # never executes through a setup hook" boundary the step above exists to
      # preserve. `go install`-from-source was how these were first obtained
      # locally, but building three Go binaries from scratch on every one of
      # the three matrix legs, every run, buys nothing a pinned release
      # binary doesn't already give (Go itself isn't otherwise needed here) --
      # so this fetches the same pinned versions as prebuilt release assets
      # instead, which is seconds of network I/O rather than a compile.
      - name: Install external lint/validation CLIs (kubeconform, actionlint, kustomize, kubectl, hadolint)
        run: |
          set -euo pipefail
          bindir="$HOME/.local/bin"
          mkdir -p "$bindir"
          echo "$bindir" >> "$GITHUB_PATH"
          workdir="$(mktemp -d)"
          cd "$workdir"

          # kubeconform v0.8.0 -- checksum from the release's own CHECKSUMS file.
          curl -fsSL -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz"
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          install -m 0755 kubeconform "$bindir/kubeconform"

          # actionlint v1.7.12 -- checksum from the release's own checksums file.
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          install -m 0755 actionlint "$bindir/actionlint"

          # kustomize v5.8.1 -- checksum from the release's own checksums.txt.
          curl -fsSL -o kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz"
          echo "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          install -m 0755 kustomize "$bindir/kustomize"

          # kubectl v1.37.0 (client only) -- render_pipeline.py's only use of it
          # is the offline `kubectl kustomize <path>` render fallback, never a
          # live cluster; checksum from dl.k8s.io's own .sha256 sidecar file.
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl"
          echo "6129359f4e1f3848a5572ccb0b26cf28b8ca08cef38c95a765b2f64a2c961a2f  kubectl" | sha256sum -c -
          install -m 0755 kubectl "$bindir/kubectl"

          # hadolint v2.15.1 -- upstream publishes no checksum sidecar for this
          # asset (unlike the three tools above), so there is no upstream-supplied
          # value to pin against.
          #
          # Corroborated instead across two independent distribution channels:
          # this GitHub release binary and the binary bundled inside the
          # hadolint-py wheel on PyPI hash identically to
          # c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507.
          # Two separate publishing paths agreeing is weaker than a signed
          # upstream checksum but much stronger than one locally computed hash,
          # since tampering would have to reach both. Re-verify the same way if
          # this pin is ever moved to a new version.
          curl -fsSL -o hadolint "https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64"
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" | sha256sum -c -
          install -m 0755 hadolint "$bindir/hadolint"

          # cargo-audit v0.22.2 -- the prebuilt musl binary, so no Rust toolchain
          # is needed in CI. Like hadolint, this release publishes no checksum
          # asset (.sha256 is a 404), so the pin is a hash computed at authoring
          # time. Unlike hadolint there is no second distribution channel to
          # corroborate it against, so treat this as the weakest pin in this step
          # and re-verify on any version bump.
          #
          # Without it, Heimdall's rust-audit tests skip themselves rather than
          # run -- they were skipping in CI for exactly that reason.
          curl -fsSL -o cargo-audit.tgz "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz"
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  cargo-audit.tgz" | sha256sum -c -
          tar xzf cargo-audit.tgz
          install -m 0755 cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit "$bindir/cargo-audit"

          cd - >/dev/null
          rm -rf "$workdir"

          kubeconform -v
          actionlint -version
          kustomize version
          kubectl version --client
          hadolint --version

      - name: Run tests
        # L8 has its own explicitly disabled, hardware-calibrated workflow.
        # Keep ordinary CI from activating those suites through recursion.
        run: |
          pytest Asgard_Test/ -v --tb=short \
            --ignore=Asgard_Test/fixtures \
            --ignore=Asgard_Test/L8_PerfBudgets \
            --ignore-glob='Asgard_Test/**/L8_Performance'
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          pytest Asgard_Test/ --cov=Asgard --cov-report=term-missing --cov-report=xml \
            --ignore=Asgard_Test/fixtures \
            --ignore=Asgard_Test/L8_PerfBudgets \
            --ignore-glob='Asgard_Test/**/L8_Performance'
        env:
          PYTHONPATH: ${{ github.event_name == 'pull_request' && github.workspace || '' }}

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
