[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asguardian"
dynamic = ["version"]
description = "Asguardian - Universal Development Tools Suite"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "Asgard Contributors"}
]
keywords = [
    "code-quality",
    "static-analysis",
    "security",
    "testing",
    "api-validation",
    "schema-validation",
    "monitoring",
    "developer-tools",
    "linting",
    "architecture",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    # Pinned to the exact release whose bundled browsers.json expects
    # chromium/chromium-headless-shell revision 1194 -- the build actually
    # present at /opt/pw-browsers in this environment. Any other playwright
    # version expects a different revision and silently skips the Freya
    # browser tests instead of launching against a mismatched build.
    "playwright==1.56.0",
    "httpx>=0.24.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    # The C/JS/TS pointer-taint and multi-language engines degrade safely to
    # analysis_truncated=True when tree-sitter is absent, so the suite that
    # exercises their real detection needs the grammars actually installed.
    # Without this, CI silently ran those tests against the degraded path.
    "asguardian[treesitter]",
    # Same reasoning, for a security test rather than a detection one:
    # test_planted_pylint_init_hook_not_executed asserts that a scanned
    # repository's .pylintrc cannot run arbitrary code inside the scanner via
    # init-hook. It skips itself when pylint is not on PATH, so CI -- which
    # installs only .[test] -- had never run it. mypy and ruff are already
    # installed by the workflow; pylint was the one linter the isolation
    # suite needs and nothing provided.
    "pylint>=3.0",
]
ast = [
    "tree-sitter>=0.23",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-java",
    "tree-sitter-go",
    "tree-sitter-ruby",
    "tree-sitter-php",
    "tree-sitter-c-sharp",
    "tree-sitter-cpp",
    "tree-sitter-rust",
    "tree-sitter-c",
]
treesitter = [
    "tree-sitter==0.25.2",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-java",
    "tree-sitter-go",
    "tree-sitter-ruby",
    "tree-sitter-php",
    "tree-sitter-c-sharp",
    "tree-sitter-cpp",
    "tree-sitter-rust",
    "tree-sitter-c",
]

[project.scripts]
asguardian = "Asgard.cli:main"
heimdall = "Asgard.Heimdall.cli:main"
freya = "Asgard.Freya.cli:main"
forseti = "Asgard.Forseti.cli:main"
verdandi = "Asgard.Verdandi.cli:main"
volundr = "Asgard.Volundr.cli:main"
asguardian-mcp = "Asgard.MCP.server:main"
asguardian-dashboard = "Asgard.Dashboard.server:main"
# Compatibility with existing command examples and external launchers.
asgard = "Asgard.cli:main"
asgard-mcp = "Asgard.MCP.server:main"
asgard-dashboard = "Asgard.Dashboard.server:main"

[project.urls]
Homepage = "https://github.com/JakeDruett/asguardian"
Documentation = "https://github.com/JakeDruett/asguardian#readme"
Repository = "https://github.com/JakeDruett/asguardian"

[tool.setuptools.packages.find]
include = ["Asgard", "Asgard.*"]
exclude = ["Asgard_Test", "Asgard_Test.*"]

[tool.setuptools.package-data]
"Asgard.Heimdall.Security.TaintAnalysis.stubs" = ["*.yml"]

[tool.pytest.ini_options]
testpaths = ["Asgard_Test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short --ignore=Asgard_Test/fixtures"
markers = [
    "slow: marks tests as slow",
    "unit: unit tests",
    "integration: integration tests",
    "volundr: Volundr package tests",
    "heimdall: Heimdall package tests",
    "freya: Freya package tests",
    "verdandi: Verdandi package tests",
    "forseti: Forseti package tests",
    "backend_init: BackendInit package tests",
    "setup_hooks: HooksSetup package tests",
    "L0: level 0 unit tests (no I/O or network)",
    "fast: fast tests with no I/O or network",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "Asgard_Test/fixtures",
    "Asgard_Test/L5_known_bad",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "SIM108", # use ternary operator (can reduce readability)
]

[tool.ruff.lint.isort]
known-first-party = ["Asgard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["Asgard_Test/fixtures"]

[tool.coverage.run]
source = ["Asgard"]
omit = [
    "Asgard_Test/*",
    "*/test_*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
